# Боевой запуск на VPS. Локальная разработка — по-прежнему docker-compose.yml.
#
# Все команды — через скрипты в deploy/ или так:
#   docker compose -f docker-compose.prod.yml --env-file .env.production <команда>
#
# Наружу открыт только Caddy (80/443). База и Redis доступны лишь внутри
# docker-сети — из интернета до них не достучаться.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: saudabot-app:latest
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://wa:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env.production}@postgres:5432/wa_saas?schema=public
    REDIS_URL: redis://redis:6379
    APP_URL: https://${DOMAIN:?задайте DOMAIN в .env.production}
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wa_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa_saas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # appendonly — очередь переживает перезапуск: сообщения клиентов не теряются.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Одноразовый: применяет миграции и завершается. Веб и воркер ждут его.
  migrate:
    <<: *app
    build: .
    working_dir: /app/packages/db
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-p", "3000", "-H", "0.0.0.0"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: ["node_modules/.bin/tsx", "src/index.ts"]
    # Даём доработать текущему ответу ассистента при перезапуске.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env.production — на него Let's Encrypt пишет о сертификате}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

  # Ежедневная копия базы в ./backups, хранится 14 дней.
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/wa_saas-$$(date +%F_%H%M).sql.gz
          if pg_dump -h postgres -U wa wa_saas | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.tmp" && echo "backup FAILED"
          fi
          find /backups -name 'wa_saas-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
